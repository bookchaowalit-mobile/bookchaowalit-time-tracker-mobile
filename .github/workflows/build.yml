name: Build Mobile App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The .NET SDK is pinned by global.json (8.0.4xx feature band). Without it the
# runner's newest preinstalled SDK (10.x) builds the app and rejects the
# net8.0-android workload as end-of-support (NETSDK1202).
# actions/setup-dotnet and actions/setup-java use tagged majors (no SHA pin yet).

jobs:
  core:
    name: Core library (build + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet --version
      - run: dotnet test tests/TimeTracker.Core.Tests --configuration Release

  app-shared:
    name: App XAML/C# compile check (no workload)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Release enables XamlC, which fails on unresolved XAML types/members.
      - run: dotnet build TimeTracker.csproj --configuration Release -p:MauiSharedCheck=true

  android:
    name: Android build (MAUI workload)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [core, app-shared]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: dotnet workload install maui-android
      - run: dotnet build TimeTracker.csproj -f net8.0-android --configuration Debug

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
